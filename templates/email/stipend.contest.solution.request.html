<!DOCTYPE html>

<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Уведомление РСХБ Digital</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <style>

        h1 {
            font-family: Ubuntu, Arial, sans-serif;
            color: #89E159;
        }

        .table_col {
            font-family: Ubuntu, Arial, sans-serif;
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            text-align: left;
            border-collapse: collapse;
            border: none;
            border-radius: 5px;
            color: #89E159;
        }

        .table_col th:first-child, .table_col td:first-child {
            color: #89E159;
            border-left: none;
        }

        .table_col th {
            font-weight: bold;
            border-bottom: 1px solid #89E159;
            padding: 8px 10px;
            width: 20%;
        }

        .table_col td {
            font-size: 1em;
            font-weight: normal;
            border-bottom: 1px solid #89E159;
            padding: 12px 10px;
            color: white;
        }

        .meta_data {
            padding-top: 2em;
            font-size: 0.75em;
            color: silver;
        }
    </style>
</head>

<body style="background: #7686A0">
<div>

    <h1>Новое решение по задаче в разделе "Стипендиальный конкурс"</h1>

    <table class="table_col">
        <tbody>

        <tr th:if="${suspicious}">
            <th scope="row">Статус</th>
            <td th:text="Подозрительно"/>
        </tr>

        <tr>
            <th scope="row">Дата</th>
            <td th:text="${submitDate}"/>
        </tr>

        <tr>
            <th scope="row">Задача</th>
            <td th:text="${task}"/>
        </tr>

        <tr>
            <th scope="row">ФИО</th>
            <td th:text="${participantName}"/>
        </tr>

        <tr>
            <th scope="row">Телефон</th>
            <td th:text="${phone}"/>
        </tr>

        <tr>
            <th scope="row">Email</th>
            <td th:text="${email}"/>
        </tr>

        <tr>
            <th scope="row">Комментарий</th>
            <td th:text="${comment}"/>
        </tr>

        </tbody>
    </table>

    <div class="meta_data">
        <span>mid:</span>
        <code th:text="${messageId}"/>
    </div>
</div>
</body>
</html>
