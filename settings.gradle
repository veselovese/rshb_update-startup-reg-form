rootProject.name = 'digital'

dependencyResolutionManagement {

    repositories {
        mavenCentral()
    }

    pluginManagement {
        repositories {
            gradlePluginPortal()
        }
    }

    versionCatalogs {

        utilLibs {
            library('guava', 'com.google.guava:guava:32.1.3-jre')
            library('apache-commons-text', 'org.apache.commons:commons-text:1.10.0')
            library('apache-commons-collections4', 'org.apache.commons:commons-collections4:4.4')
            library('apache-commons-io', 'commons-io:commons-io:2.11.0')
            library('apache-poi-ooxml', 'org.apache.poi:poi-ooxml:5.2.4')
            library('bucket4j', 'com.github.vladimir-bukhtoyarov:bucket4j-core:7.6.0')
        }

        metaLibs {
            library('prometeus', 'io.micrometer:micrometer-registry-prometheus:1.11.4')
            library('openapi-starter', 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0')
            library('swagger-annotations', 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.15')
        }

        clientLibs {
            library('vk-sdk', 'com.vk.api:sdk:1.0.14')
        }

        logLibs {
            version('logback-module', '0.1.5')

            library('logback-module-jackson', "ch.qos.logback.contrib", "logback-jackson").versionRef('logback-module')
            library('logback-module-json', "ch.qos.logback.contrib", "logback-json-classic").versionRef('logback-module')
        }

        testLibs {
            version('testcontainers', '1.18.3')

            library('testcontainers-postgres', "org.testcontainers", 'postgresql').versionRef('testcontainers')
            library('testcontainers-jupiter', "org.testcontainers", 'junit-jupiter').versionRef('testcontainers')
        }
    }
}

