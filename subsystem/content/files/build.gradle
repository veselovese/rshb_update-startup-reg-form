plugins {
    id 'ru.rshb.intech.digital.java-conventions'
}

group = 'ru.rshb.intech.digital.subsystem.content'
description = 'Files Index'

base {
    archivesName = 'files-index'
}

dependencies {

    implementation project(':subsystem:notifications:entity')

    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.data:spring-data-jpa'
}
