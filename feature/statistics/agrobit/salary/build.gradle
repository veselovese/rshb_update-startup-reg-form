plugins {
    id 'ru.rshb.intech.digital.java-conventions'
}

group = "ru.rshb.intech.digital.feature.statistics.agrobit"
description = 'Statistics Agrobit Salary'

base {
    archivesName = 'statistics-agrobit-salary'
}

dependencies {

    api project(':subsystem:messages')
    api project(':feature:statistics:agrobit:commons')
    api project(':feature:statistics:agrobit:sf-client')

    implementation project(':commons:utils')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation metaLibs.openapi.starter
}

test {
    useJUnitPlatform()
}
