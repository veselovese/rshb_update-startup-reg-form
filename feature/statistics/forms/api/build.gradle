plugins {
    id 'ru.rshb.intech.digital.java-conventions'
    id 'jacoco'
}

group = 'ru.rshb.intech.digital.feature.statistics.forms'
description = 'Form Usage Statistics API'

base {
    archivesName = 'statistics-forms-api'
}

dependencies {

    api project(':feature:statistics:forms:entity')

    implementation project(':commons:utils')
    implementation project(':subsystem:messages')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation utilLibs.guava
}

test.finalizedBy jacocoTestReport
check.dependsOn jacocoTestCoverageVerification

test {
    useJUnitPlatform()
}
