plugins {
    id 'ru.rshb.intech.digital.java-conventions'
}

group = 'ru.rshb.intech.digital.feature.references.universities'
description = 'Universities VK'

base {
    archivesName = 'references-universities-vk'
}

dependencies {

    api project(':feature:references:universities:api')

    implementation project(':subsystem:integrations:vk')

    implementation 'org.springframework:spring-context'
    implementation utilLibs.apache.commons.io
    implementation 'org.apache.commons:commons-lang3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}
