plugins {
    id 'ru.rshb.intech.digital.java-conventions'
}

group = 'ru.rshb.intech.digital.feature.references.countries'
description = 'Countries Core'

base {
    archivesName = 'references-countries-core'
}

dependencies {

    implementation project(':feature:references:countries:entity')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation project(':subsystem:migration:postgres')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation testLibs.testcontainers.jupiter
    testImplementation testLibs.testcontainers.postgres
}
